<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gif-Guardian</title>

    <style>
      :root {
        --bg-page: #1a1a1b;
        --bg-panel: #0b0b0b;
        --bg-hover: #161616;
        
        --text-main: #d7dadd;
        --text-muted: #818384;
        --text-white: #ffffff;
        
        --green-main: #52a835;
        --green-border: #28561b;
        --green-hover: #5ebc3f;
        
        --border-dim: #1f1f1f;
        
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 20px;
        background-color: var(--bg-page);
        color: var(--text-main);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      .app-panel {
        max-width: 960px;
        margin: 0 auto;
        background-color: var(--bg-panel);
        border: 1px solid var(--green-border);
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-dim);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        width: 32px;
        height: 32px;
        background-color: var(--green-main);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-white);
      }

      .brand-icon svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .brand-titles h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: var(--text-white);
        letter-spacing: 0.2px;
      }

      .brand-titles span {
        font-size: 12px;
        color: var(--text-muted);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
        border: none;
        background: transparent;
        color: var(--text-main);
        padding: 0;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-sync {
        background-color: var(--green-main);
        color: var(--text-white);
        border-radius: 20px;
        padding: 6px 16px;
      }

      .btn-sync:hover:not(:disabled) {
        background-color: var(--green-hover);
      }

      .btn-sync svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .btn-icon {
        color: var(--text-muted);
        padding: 4px;
        border-radius: 4px;
      }

      .btn-icon:hover:not(:disabled) {
        color: var(--text-white);
        background-color: var(--border-dim);
      }

      .btn-icon svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      .app-content {
        padding: 20px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }

      .metric-box {
        border: 1px solid var(--green-border);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--text-white);
        font-weight: 600;
      }

      .metric-box span {
        color: var(--green-main);
        font-size: 16px;
      }

      .metric-wide {
        grid-column: 1 / -1;
      }

      .status-container {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: normal;
        color: var(--text-main);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: currentColor;
      }

      .status-ok { color: var(--green-main); }
      .status-err { color: #ea0027; }
      .status-wait { color: var(--text-muted); }

      .table-wrapper {
        border: 1px solid var(--border-dim);
        border-radius: 8px;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th {
        background-color: var(--bg-hover);
        padding: 10px 16px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border-dim);
      }

      td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-dim);
        color: var(--text-main);
      }

      tbody tr:last-child td { border-bottom: none; }
      tbody tr:hover { background-color: var(--bg-hover); }

      .cell-id { font-family: ui-monospace, monospace; color: var(--text-muted); font-size: 13px; }
      .cell-sub { color: var(--text-muted); font-size: 13px; }

      .tag {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .tag-active {
        border: 1px solid var(--green-border);
        color: var(--green-main);
        background-color: rgba(82, 168, 53, 0.1);
      }

      .tag-disabled {
        border: 1px solid var(--border-dim);
        color: var(--text-muted);
      }

      .btn-row {
        border: 1px solid var(--border-dim);
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 12px;
      }

      .btn-row:hover:not(:disabled) {
        border-color: var(--text-muted);
        background-color: var(--border-dim);
        color: var(--text-white);
      }

      .btn-row.danger:hover:not(:disabled) {
        border-color: #ea0027;
        color: #ea0027;
        background-color: rgba(234, 0, 39, 0.1);
      }

      .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

      @media (max-width: 768px) {
        .metrics { grid-template-columns: 1fr; }
        header { flex-direction: column; align-items: flex-start; gap: 16px; }
      }
    </style>
  </head>
  <body>
    
    <main class="app-panel">
      <header>
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
          </div>
          <div class="brand-titles">
            <h1>Gif-Guardian Registry</h1>
            <span>r/Coconaad AutoModerator Tool</span>
          </div>
        </div>
        
        <div class="header-actions">
          <button id="refresh" class="btn-icon" title="Refresh Data">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
          <button id="initialize" class="btn-sync">
            <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
            Sync AutoMod
          </button>
        </div>
      </header>

      <div class="app-content">
        <div class="metrics">
          <div class="metric-box">
            <span id="active-count">0</span> Active Rules
          </div>
          <div class="metric-box">
            <span id="disabled-count">0</span> Disabled
          </div>
          <div class="metric-box">
            <span id="audit-count">0</span> Audit Logs
          </div>
          <div class="metric-box metric-wide">
            AutoModerator Status: 
            <div class="status-container">
              <div id="status-dot" class="status-dot status-wait"></div>
              <span id="status-text">Checking...</span>
            </div>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Giphy ID</th>
                <th>Status</th>
                <th>Reason</th>
                <th>Moderator</th>
                <th>Date</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="gif-table">
              <tr><td colspan="6" class="empty-state">Loading Registry...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      async function request(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `Error ${response.status}`);
        return data;
      }

      function updateStatus(text, stateClass) {
        const textEl = document.getElementById('status-text');
        const dotEl = document.getElementById('status-dot');
        
        textEl.textContent = text;
        textEl.style.color = 'inherit';
        dotEl.className = `status-dot ${stateClass}`;
      }

      function render(state) {
        const gifs = Array.isArray(state.gifs) ? state.gifs : [];
        const automod = state.automod || { pageExists: false, managedBlockPresent: false };

        document.getElementById('active-count').textContent = gifs.filter(g => g.status === 'active').length;
        document.getElementById('disabled-count').textContent = gifs.filter(g => g.status === 'disabled').length;
        document.getElementById('audit-count').textContent = Array.isArray(state.audit) ? state.audit.length : 0;

        if (automod.pageExists && automod.managedBlockPresent) {
          updateStatus('Synced & Active', 'status-ok');
        } else if (automod.pageExists) {
          updateStatus('Block Missing', 'status-wait');
        } else {
          updateStatus('Config Unavailable', 'status-err');
        }

        const table = document.getElementById('gif-table');
        table.replaceChildren();

        if (gifs.length === 0) {
          table.innerHTML = `<tr><td colspan="6" class="empty-state">No restricted GIFs found in registry.</td></tr>`;
          return;
        }

        gifs.forEach(gif => {
          const isActive = gif.status === 'active';
          const row = document.createElement('tr');
          
          row.innerHTML = `
            <td class="cell-id">${gif.giphyId}</td>
            <td><span class="tag ${isActive ? 'tag-active' : 'tag-disabled'}">${gif.status}</span></td>
            <td class="cell-sub">${gif.reason || '—'}</td>
            <td class="cell-sub">u/${gif.addedBy}</td>
            <td class="cell-sub">${new Date(gif.addedAt).toLocaleDateString()}</td>
            <td style="text-align: right;">
              <button class="btn-row ${isActive ? 'danger' : ''}" data-action="${isActive ? 'disable' : 'restore'}" data-id="${gif.giphyId}">
                ${isActive ? 'Disable' : 'Restore'}
              </button>
            </td>
          `;
          table.appendChild(row);
        });
      }

      async function load() {
        updateStatus('Fetching data...', 'status-wait');
        try {
          const state = await request('/api/state');
          render(state);
        } catch (error) {
          updateStatus(error.message, 'status-err');
        }
      }

      document.getElementById('refresh').addEventListener('click', load);

      document.getElementById('initialize').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        const originalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = 'Syncing...';
        
        try {
          await request('/api/initialize-automod', { method: 'POST', body: '{}' });
          await load();
        } catch (error) {
          alert(`Sync failed: ${error.message}`);
        } finally {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      });

      document.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;

        const { action, id } = btn.dataset;
        if (!window.confirm(`Execute ${action} on ${id}?`)) return;

        btn.disabled = true;
        btn.textContent = '...';
        
        try {
          await request(`/api/${action}`, {
            method: 'POST',
            body: JSON.stringify({ giphyId: id })
          });
          await load();
        } catch (error) {
          alert(`Action failed: ${error.message}`);
          btn.disabled = false;
          btn.textContent = action === 'disable' ? 'Disable' : 'Restore';
        }
      });

      load();
    </script>
  </body>
</html>

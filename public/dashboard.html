<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gif-Guardian</title>

    <style>
    :root {
      --bg-page: #121212;
      --bg-panel: #0b0b0b;
      --bg-box: #111111;
      --bg-hover: #161616;

      --text-main: #d7dadd;
      --text-muted: #818384;
      --text-white: #ffffff;

      --green-main: #52a835;
      --green-border: #28561b;
      --red-main: #ea0027;

      --border-dim: #1f1f1f;

      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      background-color: var(--bg-panel);
      border-radius: 8px;
    }

    .header {
      padding: 20px;
      border-bottom: 1px solid var(--border-dim);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background-color: var(--green-main);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-white);
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-white);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .ok {
      color: var(--green-main);
    }
    .err {
      color: var(--red-main);
    }
    .wait {
      color: var(--text-muted);
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      padding: 0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--green-main);
      color: var(--text-white);
      border-radius: 20px;
      padding: 6px 16px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #5ebc3f;
    }

    .btn-icon {
      color: var(--text-muted);
    }

    .btn-icon:hover:not(:disabled) {
      color: var(--text-white);
    }

    .btn-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .metrics {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
    }

    .metric-box {
      background-color: var(--bg-box);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-white);
      font-weight: 600;
      font-size: 14px;
    }

    .metric-box span {
      color: var(--green-main);
    }

    .empty {
      text-align: center;
      padding: 24px 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .blacklist-button {
      margin: 0 20px 20px;
      width: calc(100% - 40px);
      min-height: 40px;
      border: 1px solid var(--green-main);
      border-radius: 6px;
      color: var(--text-white);
      background: transparent;
    }

    .blacklist-button:hover {
      background: var(--green-main);
    }

    .blacklist-modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      overflow: auto;
      padding: 24px;
      background: rgba(0, 0, 0, 0.88);
    }

    .blacklist-modal.open {
      display: block;
    }

    .blacklist-panel {
      position: relative;
      width: min(1100px, 100%);
      min-height: calc(100vh - 48px);
      margin: 0 auto;
      padding: 24px 24px 88px;
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
    }

    .blacklist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .blacklist-header h2 {
      margin: 0;
      color: var(--text-white);
      font-size: 20px;
    }

    .blacklist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }

    .blacklist-card {
      position: relative;
      min-height: 220px;
      overflow: hidden;
      background: var(--bg-box);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
      cursor: pointer;
    }

    .blacklist-card:focus-visible,
    .blacklist-card:hover,
    .blacklist-card.expanded {
      border-color: var(--green-main);
      outline: none;
    }

    .blacklist-card input {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      width: 18px;
      height: 18px;
      accent-color: var(--green-main);
    }

    .gif-preview {
      display: block;
      width: 100%;
      height: 170px;
      border: 0;
      background: #000;
      object-fit: cover;
    }

    .preview-unavailable {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      color: var(--text-muted);
      text-align: center;
    }

    .repair-preview {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--green-main);
      border-radius: 6px;
      color: var(--text-white);
    }

    .repair-preview:hover:not(:disabled) {
      background: var(--green-main);
    }

    .gif-card-label {
      padding: 10px 12px;
      color: var(--text-white);
      font-weight: 700;
    }

    .gif-details {
      position: absolute;
      inset: auto 0 0;
      padding: 12px;
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.9);
      transform: translateY(100%);
      transition: transform 0.16s ease;
    }

    .blacklist-card:hover .gif-details,
    .blacklist-card:focus-visible .gif-details,
    .blacklist-card.expanded .gif-details {
      transform: translateY(0);
    }

    .gif-details div {
      margin-top: 4px;
    }

    .gif-details strong {
      color: var(--text-white);
    }

    .source-link {
      color: var(--text-white);
      font-weight: 700;
      text-decoration: none;
    }

    .source-link:hover,
    .source-link:focus-visible {
      text-decoration: underline;
    }

    .remove-selected {
      position: fixed;
      right: 36px;
      bottom: 28px;
      z-index: 12;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 22px;
      color: var(--text-white);
      background: var(--red-main);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 600px) {
      .blacklist-modal {
        padding: 0;
      }

      .blacklist-panel {
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }

      .blacklist-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .gif-preview {
        height: 135px;
      }

      .remove-selected {
        right: 20px;
        bottom: 20px;
      }
    }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="header">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"
              />
            </svg>
          </div>
          <h1 class="title">Gif-Guardian</h1>
        </div>

        <div class="controls">
          <div class="status">
            <div id="status-dot" class="dot wait"></div>
            <span id="status-text">Checking</span>
          </div>
          <button type="button" id="initialize" class="btn-primary" hidden>
            Sync AutoModerator
          </button>
        </div>
      </div>

      <div class="metrics">
        <div class="metric-box"><span id="active-count">0</span> Active</div>
        <div class="metric-box">
          <span id="disabled-count">0</span>
          Disabled
        </div>
      </div>

      <button type="button" id="open-blacklist" class="blacklist-button">
        Blacklist
      </button>
    </main>

    <div id="blacklist-modal" class="blacklist-modal" aria-hidden="true">
      <section
        class="blacklist-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="blacklist-title"
      >
        <div class="blacklist-header">
          <h2 id="blacklist-title">Blacklist</h2>
          <button
            type="button"
            id="close-blacklist"
            class="btn-icon"
            aria-label="Close blacklist"
          >
            Close
          </button>
        </div>
        <label>
          <input type="checkbox" id="select-all-blacklist">
          Select all
        </label>
        <div id="blacklist-grid" class="blacklist-grid"></div>
        <button
          type="button"
          id="remove-selected"
          class="remove-selected"
          disabled
        >
          Remove selected
        </button>
      </section>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>

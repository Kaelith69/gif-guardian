<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gif-Guardian</title>

    <style>
    :root {
      --bg-page: #121212;
      --bg-panel: #0b0b0b;
      --bg-box: #111111;
      --bg-hover: #161616;

      --text-main: #d7dadd;
      --text-muted: #818384;
      --text-white: #ffffff;

      --green-main: #52a835;
      --green-border: #28561b;
      --red-main: #ea0027;

      --border-dim: #1f1f1f;

      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      background-color: var(--bg-panel);
      border: 1px solid var(--green-border);
      border-radius: 8px;
    }

    .header {
      padding: 20px;
      border-bottom: 1px solid var(--border-dim);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background-color: var(--green-main);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-white);
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-white);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .ok {
      color: var(--green-main);
    }
    .err {
      color: var(--red-main);
    }
    .wait {
      color: var(--text-muted);
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      padding: 0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--green-main);
      color: var(--text-white);
      border-radius: 20px;
      padding: 6px 16px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #5ebc3f;
    }

    .btn-icon {
      color: var(--text-muted);
    }

    .btn-icon:hover:not(:disabled) {
      color: var(--text-white);
    }

    .btn-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .metrics {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
    }

    .metric-box {
      background-color: var(--bg-box);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-white);
      font-weight: 600;
      font-size: 14px;
    }

    .metric-box span {
      color: var(--green-main);
    }

    .registry {
      padding: 0 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .registry-item {
      background-color: var(--bg-box);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: background-color 0.15s;
      user-select: none;
    }

    .registry-item:hover {
      background-color: var(--bg-hover);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .item-id {
      font-family: ui-monospace, monospace;
      color: var(--text-white);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      color: var(--text-muted);
      font-size: 12px;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .tag.active {
      color: var(--green-main);
    }
    .tag.disabled {
      color: var(--text-muted);
    }

    .btn-action {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12px;
    }

    .btn-action:hover:not(:disabled) {
      color: var(--text-white);
    }

    .btn-action.danger:hover:not(:disabled) {
      color: var(--red-main);
    }

    .item-details {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-dim);
      font-size: 12px;
      color: var(--text-muted);
    }

    .registry-item.expanded .item-details {
      display: flex;
    }

    .item-details strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .source-link {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    .empty {
      text-align: center;
      padding: 24px 0;
      color: var(--text-muted);
      font-size: 13px;
    }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="header">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"
              />
            </svg>
          </div>
          <h1 class="title">Gif-Guardian</h1>
        </div>

        <div class="controls">
          <div class="status">
            <div id="status-dot" class="dot wait"></div>
            <span id="status-text">Checking</span>
          </div>
          <button type="button" id="initialize" class="btn-primary">
            Sync Rules
          </button>
          <button
            type="button"
            id="refresh"
            class="btn-icon"
            aria-label="Refresh"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="metrics">
        <div class="metric-box"><span id="active-count">0</span> Active</div>
        <div class="metric-box">
          <span id="disabled-count">0</span>
          Disabled
        </div>
        <div class="metric-box"><span id="audit-count">0</span> Logs</div>
      </div>

      <div class="registry" id="gif-list">
        <div class="empty">Loading...</div>
      </div>
    </main>

    <script>
    async function request(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      })
      const data = await response.json().catch(() => ({}))
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`)
      return data
    }

    function updateStatus(text, stateClass) {
      document.getElementById('status-text').textContent = text
      document.getElementById('status-dot').className = `dot ${stateClass}`
    }

    function render(state) {
      const gifs = Array.isArray(state.gifs) ? state.gifs : []
      const automod = state.automod || {
        pageExists: false,
        managedBlockPresent: false,
        state: {},
      }

      document.getElementById('active-count').textContent = gifs.filter(
        gif => gif.status === 'active',
      ).length
      document.getElementById('disabled-count').textContent = gifs.filter(
        gif => gif.status === 'disabled',
      ).length
      document.getElementById('audit-count').textContent = Array.isArray(
        state.audit,
      )
        ? state.audit.length
        : 0

      if (automod.state.syncStatus === 'error') {
        updateStatus('Sync error', 'err')
      } else if (automod.state.syncStatus === 'pending') {
        updateStatus('Sync pending', 'wait')
      } else if (automod.pageExists && automod.managedBlockPresent) {
        updateStatus('Synced', 'ok')
      } else if (automod.pageExists) {
        updateStatus('Unsynced', 'wait')
      } else {
        updateStatus('Failed', 'err')
      }

      const list = document.getElementById('gif-list')
      list.innerHTML = ''

      if (gifs.length === 0) {
        const empty = document.createElement('div')
        empty.className = 'empty'
        empty.textContent = 'No entries'
        list.appendChild(empty)
        return
      }

      gifs.forEach(gif => {
        const isActive = gif.status === 'active'
        const dateStr = new Date(gif.firstAddedAt).toLocaleDateString(
          undefined,
          {
            month: 'short',
            day: 'numeric',
            year: '2-digit',
          },
        )
        const item = document.createElement('div')
        item.className = 'registry-item'

        const header = document.createElement('div')
        header.className = 'item-header'
        const info = document.createElement('div')
        info.className = 'item-info'
        const id = document.createElement('span')
        id.className = 'item-id'
        id.textContent = gif.giphyId
        const meta = document.createElement('span')
        meta.className = 'item-meta'
        meta.textContent = `u/${gif.firstAddedBy || 'unknown'} • ${dateStr}`
        info.append(id, meta)

        const actions = document.createElement('div')
        actions.className = 'item-actions'
        const tag = document.createElement('span')
        tag.className = `tag ${isActive ? 'active' : 'disabled'}`
        tag.textContent = gif.status
        const button = document.createElement('button')
        button.type = 'button'
        button.className = `btn-action ${isActive ? 'danger' : ''}`
        button.dataset.action = isActive ? 'disable' : 'restore'
        button.dataset.id = gif.giphyId
        button.textContent = isActive ? 'Disable' : 'Restore'
        actions.append(tag, button)
        header.append(info, actions)

        const details = document.createElement('div')
        details.className = 'item-details'
        const reason = document.createElement('div')
        const reasonLabel = document.createElement('strong')
        reasonLabel.textContent = 'Reason: '
        reason.append(
          reasonLabel,
          document.createTextNode(gif.reason || 'None provided'),
        )
        details.append(reason)

        if (gif.sourceUrl && /^https:\/\//i.test(gif.sourceUrl)) {
          const source = document.createElement('div')
          const link = document.createElement('a')
          link.href = gif.sourceUrl
          link.target = '_blank'
          link.rel = 'noopener noreferrer'
          link.className = 'source-link'
          link.textContent = 'View Source Context ↗'
          source.append(link)
          details.append(source)
        }

        item.append(header, details)
        list.appendChild(item)
      })
    }

    async function load() {
      updateStatus('Checking', 'wait')
      try {
        const state = await request('/api/state')
        render(state)
      } catch (error) {
        updateStatus('Failed', 'err')
      }
    }

    document.getElementById('refresh').addEventListener('click', load)

    document
      .getElementById('initialize')
      .addEventListener('click', async event => {
        const button = event.currentTarget
        button.disabled = true
        try {
          await request('/api/initialize-automod', {method: 'POST', body: '{}'})
          await load()
        } catch (error) {
          alert(`Sync failed: ${error.message}`)
        } finally {
          button.disabled = false
        }
      })

    document
      .getElementById('gif-list')
      .addEventListener('click', async event => {
        const button = event.target.closest('button[data-action]')
        if (button) {
          event.stopPropagation()
          const {action, id} = button.dataset
          button.disabled = true
          try {
            await request(`/api/${action}`, {
              method: 'POST',
              body: JSON.stringify({giphyId: id}),
            })
            await load()
          } catch (error) {
            alert(`Action failed: ${error.message}`)
            button.disabled = false
          }
          return
        }

        const item = event.target.closest('.registry-item')
        if (item) item.classList.toggle('expanded')
      })

    void load()
    </script>
  </body>
</html>

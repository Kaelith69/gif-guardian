<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gif-Guardian</title>

    <style>
      :root {
        --bg-page: #121212;
        --bg-panel: #0b0b0b;
        --bg-box: #111111;
        --bg-hover: #161616;

        --text-main: #d7dadd;
        --text-muted: #818384;
        --text-white: #ffffff;

        --green-main: #52a835;
        --green-border: #28561b;
        --red-main: #ea0027;

        --border-dim: #1f1f1f;

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 20px;
        background-color: var(--bg-page);
        color: var(--text-main);
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
        display: flex;
        justify-content: center;
      }

      .app {
        width: 100%;
        max-width: 420px;
        background-color: var(--bg-panel);
        border: 1px solid var(--border-dim);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }

      /* Header */
      .header {
        padding: 24px 20px;
        border-bottom: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        width: 32px;
        height: 32px;
        background-color: var(--green-main);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-white);
      }

      .brand-icon svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: var(--text-white);
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-muted);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: currentColor;
      }

      .ok { color: var(--green-main); }
      .err { color: var(--red-main); }
      .wait { color: var(--text-muted); }

      /* Buttons */
      button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        padding: 0;
        color: var(--text-muted);
        transition: color 0.15s ease, background-color 0.15s ease;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background-color: var(--green-main);
        color: var(--text-white);
        border-radius: 20px;
        padding: 6px 16px;
      }

      .btn-primary:hover:not(:disabled) {
        background-color: #5ebc3f;
      }

      .btn-icon:hover:not(:disabled) {
        color: var(--text-white);
      }

      .btn-icon svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      /* Stacked Content area */
      .content {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      /* Stacked Metrics */
      .metrics {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .metric-box {
        background-color: var(--bg-box);
        border: 1px solid var(--border-dim);
        border-radius: 6px;
        padding: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--text-white);
        font-weight: 600;
        font-size: 13px;
      }

      .metric-box span {
        color: var(--green-main);
      }

      /* Registry List */
      .registry {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .registry-item {
        background-color: var(--bg-box);
        border: 1px solid var(--border-dim);
        border-radius: 6px;
        padding: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .registry-item:hover {
        background-color: var(--bg-hover);
      }

      .item-left {
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow: hidden;
      }

      .item-id {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: var(--text-white);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-meta {
        color: var(--text-muted);
        font-size: 12px;
      }

      .item-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .tag {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .tag.active { color: var(--green-main); }
      .tag.disabled { color: var(--text-muted); }

      .btn-action {
        color: var(--text-muted);
        font-weight: 500;
        font-size: 12px;
      }

      .btn-action:hover:not(:disabled) {
        color: var(--text-white);
      }

      .empty {
        text-align: center;
        padding: 24px 0;
        color: var(--text-muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="header">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
            </svg>
          </div>
          <h1 class="title">Gif-Guardian</h1>
        </div>

        <div class="controls">
          <div class="status">
            <div id="status-dot" class="dot wait"></div>
            <span id="status-text">Checking</span>
          </div>
          <button type="button" id="initialize" class="btn-primary">
            Sync Rules
          </button>
          <button type="button" id="refresh" class="btn-icon" aria-label="Refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
            </svg>
          </button>
        </div>
      </div>

      <div class="content">
        <div class="metrics">
          <div class="metric-box">
            <span id="active-count">0</span> Active
          </div>
          <div class="metric-box">
            <span id="disabled-count">0</span> Disabled
          </div>
          <div class="metric-box">
            <span id="audit-count">0</span> Logs
          </div>
        </div>

        <div class="registry" id="gif-list">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </main>

    <script>
      async function request(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        return data;
      }

      function updateStatus(text, stateClass) {
        document.getElementById('status-text').textContent = text;
        document.getElementById('status-dot').className = `dot ${stateClass}`;
      }

      function render(state) {
        const gifs = Array.isArray(state.gifs) ? state.gifs : [];
        const automod = state.automod || { pageExists: false, managedBlockPresent: false };

        document.getElementById('active-count').textContent = gifs.filter(g => g.status === 'active').length;
        document.getElementById('disabled-count').textContent = gifs.filter(g => g.status === 'disabled').length;
        document.getElementById('audit-count').textContent = Array.isArray(state.audit) ? state.audit.length : 0;

        if (automod.pageExists && automod.managedBlockPresent) {
          updateStatus('Synced', 'ok');
        } else if (automod.pageExists) {
          updateStatus('Unsynced', 'wait');
        } else {
          updateStatus('Failed', 'err');
        }

        const list = document.getElementById('gif-list');
        list.innerHTML = '';

        if (gifs.length === 0) {
          list.innerHTML = `<div class="empty">No entries</div>`;
          return;
        }

        gifs.forEach(gif => {
          const isActive = gif.status === 'active';
          
          // Format date as "Sep 19, 26"
          const dateStr = new Date(gif.addedAt).toLocaleDateString('en-US', { 
            month: 'short', 
            day: 'numeric', 
            year: '2-digit' 
          });

          const item = document.createElement('div');
          item.className = 'registry-item';
          
          item.innerHTML = `
            <div class="item-left">
              <div class="item-id">${gif.giphyId}</div>
              <div class="item-meta">u/${gif.addedBy} • ${dateStr}</div>
            </div>
            <div class="item-right">
              <span class="tag ${isActive ? 'active' : 'disabled'}">${gif.status}</span>
              <button class="btn-action" data-action="${isActive ? 'disable' : 'restore'}" data-id="${gif.giphyId}">
                ${isActive ? 'Disable' : 'Restore'}
              </button>
            </div>
          `;
          list.appendChild(item);
        });
      }

      async function load() {
        updateStatus('Checking', 'wait');
        try {
          const state = await request('/api/state');
          render(state);
        } catch (error) {
          updateStatus('Failed', 'err');
        }
      }

      document.getElementById('refresh').addEventListener('click', load);

      document.getElementById('initialize').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        
        try {
          await request('/api/initialize-automod', { method: 'POST', body: '{}' });
          await load();
        } catch (error) {
          alert(`Sync failed: ${error.message}`);
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById('gif-list').addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;

        const { action, id } = btn.dataset;
        btn.disabled = true;
        btn.textContent = '...';
        
        try {
          await request(`/api/${action}`, {
            method: 'POST',
            body: JSON.stringify({ giphyId: id })
          });
          await load();
        } catch (error) {
          alert(`Action failed: ${error.message}`);
          btn.disabled = false;
          btn.textContent = action === 'disable' ? 'Disable' : 'Restore';
        }
      });

      load();
    </script>
  </body>
</html>

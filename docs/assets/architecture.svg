    </text>

    <g fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)">
      <path d="M272 135h72" />
      <path d="M272 249h72" />
      <path d="M272 363h72" />
      <path d="M552 135h100" />
      <path d="M552 249h100" />
      <path d="M552 363h100" />
    </g>
    <g fill="#8b949e" font-size="12">
      <text x="286" y="126">HTTP</text>
      <text x="286" y="240">HTTP</text>
      <text x="286" y="354">HTTP</text>
      <text x="582" y="126">Redis</text>
      <text x="580" y="240">Reddit API</text>
      <text x="576" y="354">wiki update</text>
    </g>
  </g>
</svg>
